[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-editer-schema"
version = "2.0.0"
description = "movie-editer とビューアがやりとりするデータの形（JSON Schema）と検査"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["movie_editer_schema"]

[tool.setuptools.package-data]
movie_editer_schema = ["schema.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
